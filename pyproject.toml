[project]
name = "orchestrator"
version = "0.1.0"
description = "Cost-aware RL orchestration with an executable evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
# R1's serving stack. Kept out of the base install so R3 and R4 — who need
# neither a GPU nor model weights — are never blocked on a CUDA wheel.
workers = ["vllm>=0.6", "transformers>=4.44"]
# Parquet is what R3 and R4 read. JSONL stays authoritative, so a sweep host
# missing pyarrow still produces a complete, readable run.
store = ["pyarrow>=16.0"]
# R2's corpus ingestion only. Not a runtime dependency of grading itself —
# `orch corpus build` needs it once to fetch HumanEval+/MBPP+; grading a
# task never does.
data = ["evalplus>=0.3.1"]

[project.scripts]
orch = "orchestrator.cli:main"
orch-workers = "orchestrator.workers.cli:main"
orch-eval = "eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Each role's tests live inside that role's commit scope, so a test change and
# the code it covers belong to the same owner and land in the same commit:
#   bench/tests                    -> workers  (R1)
#   schemas/tests                  -> schemas  (R4, all-role sign-off to change)
#   eval/tests                     -> eval     (R4)
#   src/orchestrator/policy/tests  -> policy   (R3)
testpaths = [
    "tests",
    "bench/tests",
    "schemas/tests",
    "eval/tests",
    "src/orchestrator/policy/tests",
]
